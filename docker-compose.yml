# docker compose up --build   then open http://localhost:8080
# First run only:             docker compose exec backend python seed.py
#
# DATABASE NOTE:
# The bundled Postgres ("db" service) is disabled below because this deployment uses an
# external database. The backend reads DATABASE_URL from .env (via env_file).
# To go back to the bundled Postgres, uncomment every block marked [BUNDLED DB].
services:
  # [BUNDLED DB] Local Postgres container, not used when DATABASE_URL points to an external DB.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: paypilot
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypilot}
  #     POSTGRES_DB: paypilot
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD", "pg_isready", "-U", "paypilot"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env  # copy .env.example to .env first. DATABASE_URL comes from here.
    # [BUNDLED DB] Wait for the bundled Postgres to be healthy before starting the backend.
    # depends_on:
    #   db:
    #     condition: service_healthy
    environment:
      # [BUNDLED DB] This line overrides DATABASE_URL from .env and points to the "db" container.
      # Keep it commented out so the external DATABASE_URL from .env is used.
      # DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://paypilot:${POSTGRES_PASSWORD:-paypilot}@db:5432/paypilot}
      FORWARDED_ALLOW_IPS: 172.30.0.0/16  # trust X-Forwarded-For only from containers on this network (nginx)
    # Inside the container "localhost" is the container itself: for a Postgres on this machine
    # use host.docker.internal in DATABASE_URL (works on Linux, Windows and macOS).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${VITE_BASE:-/}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"  # the VPS sets FRONTEND_PORT=18001 in .env for the host nginx
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

# [BUNDLED DB] Named volume that stored the bundled Postgres data.
# volumes:
#   pgdata: