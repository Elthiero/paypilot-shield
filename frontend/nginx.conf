server {
    listen 80;
    root /usr/share/nginx/html;

    # The frontend calls /api by default (VITE_API_URL is unset). Strip the prefix and hand it to the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, never append: a client must not be able to choose the IP the rate limiter sees
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # a real PayPal payout can take about 20 seconds
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
