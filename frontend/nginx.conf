server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind a host nginx (TLS in front), every request arrives from the compose network gateway.
    # Trust X-Forwarded-For only from that subnet, so $remote_addr below becomes the real visitor.
    # Direct connections from anywhere else are ignored, so a client cannot choose its own IP.
    set_real_ip_from 172.28.0.0/24;
    real_ip_header X-Forwarded-For;

    # The frontend calls /api by default (VITE_API_URL is unset). Strip the prefix and hand it to the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, never append: a client must not be able to choose the IP the rate limiter sees
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # a real PayPal payout can take about 20 seconds
    }

    location / {
        try_files $uri /index.html;
    }

    # Scripts only from this origin. Styles allow inline because AG Grid and React inject style rules.
    # Fonts are bundled with the app (@fontsource), so the CSP names no external host. The TLS host nginx in front can add more headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;  # ignored over plain http
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
